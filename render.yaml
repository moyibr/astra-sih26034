# Render Blueprint — deploys the ASTRA API.
#
# On render.com: New → Blueprint → pick this repository → Apply.
# Render reads this file and needs nothing else configured by hand.
#
# The frontend is not here; it is deployed separately on Vercel, which is
# better suited to Next.js. This service is the API, the OCR pipeline and the
# rule engine.

services:
  - type: web
    name: astra-sih26034-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health

    envVars:
      - key: ASTRA_ENV
        value: production

      - key: ASTRA_ACTIVE_RULEPACK
        value: lmpc-2011@2026.07.01

      # Render generates this once and keeps it. Nothing here signs anything
      # today, but a real deployment must not ship with the placeholder.
      - key: ASTRA_SECRET_KEY
        generateValue: true

      # SQLite on the container's own filesystem, deliberately.
      #
      # The free tier gives no persistent disk, so a database that outlived the
      # container would leave its evidence images behind and every finding would
      # point at a photograph that no longer exists. Keeping the records and the
      # images together means the demo is always internally consistent: it
      # returns to the baked-in baseline whenever the container restarts.
      #
      # A pilot deployment swaps this for a managed Postgres and object storage;
      # nothing in the code changes but this variable.
      - key: DATABASE_URL
        value: sqlite:////app/data/astra.db

      # The Vercel hostname is not known until the frontend has been built, and
      # every preview branch gets a different one. This matches the project's
      # own deployments rather than opening the API to any origin.
      - key: CORS_ORIGIN_REGEX
        value: ^https://(astra-sih26034|astra-sih26034-[a-z0-9-]+)\.vercel\.app$

      # Models are baked into the image, so the first scan does not wait on a
      # download. Warming them at boot keeps that cost out of the first request
      # too, which on a tier that sleeps is the request someone is watching.
      - key: WARM_OCR_ON_STARTUP
        value: "true"

      # Left off: with no key the pipeline runs entirely on local OCR and
      # pattern extraction, which is how the offline demo runs.
      - key: LLM_NORMALISER_ENABLED
        value: "false"
