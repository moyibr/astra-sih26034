# Render Blueprint — the public, browse-only deployment.
#
# On render.com: New → Blueprint → pick this repository → Apply.
#
# This deploys apps/api/Dockerfile.lite, which carries no OCR stack. The reason
# is the hardware: a free instance is 0.1 CPU and 512 MB. A scan that takes five
# seconds on a laptop takes about a minute there, and loading the ONNX models at
# boot is slow enough to overrun the health check and fail the deploy outright.
#
# So the public link serves the dashboard, the recorded inspections and their
# evidence, every finding with its citation, the rule pack and the e-commerce
# audit — and says plainly, through /health and in the interface, that live
# scanning runs on the local build. See DEPLOY.md.
#
# The frontend is deployed separately on Vercel, which suits Next.js better.

services:
  - type: web
    name: astra-sih26034-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile.lite
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health

    envVars:
      - key: ASTRA_ENV
        value: production

      - key: ASTRA_ACTIVE_RULEPACK
        value: lmpc-2011@2026.07.01

      # Render generates this once and keeps it. Nothing here signs anything
      # today, but a real deployment must not ship with the placeholder.
      - key: ASTRA_SECRET_KEY
        generateValue: true

      # SQLite on the container's own filesystem, deliberately.
      #
      # The free tier gives no persistent disk, so a database that outlived the
      # container would leave its evidence images behind and every finding would
      # point at a photograph that no longer exists. Keeping the records and the
      # images together means the demo is always internally consistent: it
      # returns to the committed baseline whenever the container restarts.
      #
      # A pilot deployment swaps this for managed Postgres and object storage;
      # nothing in the code changes but this variable.
      - key: DATABASE_URL
        value: sqlite:////app/data/astra.db

      # Seeded on first boot from data/demo/, which is committed to the
      # repository. No OCR runs during the build.
      - key: DEMO_BUNDLE_DIR
        value: /app/data/demo

      # Declined rather than merely absent. The image has no OCR stack, but
      # saying so explicitly means /health reports it and the interface can
      # explain itself instead of offering a form that would time out.
      - key: SCANNING_ENABLED
        value: "false"

      - key: WARM_OCR_ON_STARTUP
        value: "false"

      # Read-only by construction, not by hoping a credential stays secret.
      #
      # This instance publishes recorded inspections and the rule pack. Until
      # officers existed, its "Record override" and "Draft notice" buttons were
      # live on the open internet with no authentication at all -- anyone could
      # overturn a finding or sign a legal notice in any officer's name.
      #
      # Authentication now exists, and this says the showcase declines writes
      # regardless. A departmental instance sets it true and configures
      # ASTRA_OFFICERS; nothing here should be alterable by whoever opens the
      # link.
      - key: WRITES_ENABLED
        value: "false"

      # The Vercel hostname is not known until the frontend has been built, and
      # every preview branch gets a different one. This matches the project's
      # own deployments rather than opening the API to any origin.
      - key: CORS_ORIGIN_REGEX
        value: ^https://(astra-sih26034|astra-sih26034-[a-z0-9-]+)\.vercel\.app$

      - key: LLM_NORMALISER_ENABLED
        value: "false"
