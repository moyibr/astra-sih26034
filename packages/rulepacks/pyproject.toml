[project]
name = "astra-rules"
version = "0.1.0"
description = "Versioned law-as-code rule packs and the deterministic evaluator."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6", "astra-schema"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astra_rules*"]

[tool.setuptools.package-data]
astra_rules = ["../packs/**/*.yaml"]
