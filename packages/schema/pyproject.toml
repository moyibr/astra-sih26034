[project]
name = "astra-schema"
version = "0.1.0"
description = "Frozen data contracts shared by every ASTRA service."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astra_schema*"]
